<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SmartTask Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #2f439f 0%, #173cb8 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">SmartTask Manager</h1>
            <div class="flex items-center gap-4">
                <span id="userName" class="text-sm">Welcome, User</span>
                <button id="logoutBtn" class="bg-white text-gray-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8">
        <!-- Add Task Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Add New Task</h2>
            <form id="addTaskForm" class="flex flex-col md:flex-row gap-4">
                <input type="text" id="taskTitle" required
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                    placeholder="Task title">
                <input type="text" id="taskDescription"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                    placeholder="Task description (optional)">
                <select id="taskPriority" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition whitespace-nowrap">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Filter Section -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <span class="font-semibold text-gray-700">Filter:</span>
                <button class="filter-btn active px-4 py-2 rounded-lg transition" data-filter="all">All Tasks</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition" data-filter="pending">Pending</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition" data-filter="completed">Completed</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition" data-filter="high">High Priority</button>
            </div>
        </div>

        <!-- Tasks Display -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tasksContainer">
            <!-- Tasks will be dynamically added here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <h3 class="mt-4 text-xl font-medium text-gray-900">No tasks yet</h3>
            <p class="mt-2 text-gray-500">Get started by adding your first task above.</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Edit Task</h2>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <div class="space-y-4">
                    <input type="text" id="editTaskTitle" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="Task title">
                    <input type="text" id="editTaskDescription"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="Task description">
                    <select id="editTaskPriority" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="low">Low Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg transition">
                            Save Changes
                        </button>
                        <button type="button" id="cancelEdit" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 py-3 rounded-lg transition">
                            Cancel
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let tasks = [];
        let currentFilter = 'all';
        let demoMode = localStorage.getItem('demoMode') === 'true';

        // Check authentication
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) {
            window.location.href = 'login.html';
        }

        document.getElementById('userName').textContent = `Welcome, ${user.name || user.email}`;

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('demoMode');
            localStorage.removeItem('demoTasks');
            window.location.href = 'login.html';
        });

        // Load tasks
        async function loadTasks() {
            try {
                if (demoMode) {
                    tasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                    displayTasks();
                    return;
                }

                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/getTasks`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    tasks = data.tasks || [];
                    displayTasks();
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
                demoMode = true;
                localStorage.setItem('demoMode', 'true');
                tasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                displayTasks();
            }
        }

        // Display tasks
        function displayTasks() {
            const container = document.getElementById('tasksContainer');
            const emptyState = document.getElementById('emptyState');
            
            let filteredTasks = tasks.filter(task => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'pending') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                if (currentFilter === 'high') return task.priority === 'high';
                return true;
            });

            if (filteredTasks.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filteredTasks.map(task => `
                <div class="bg-white rounded-lg shadow-md p-6 border-l-4 ${getPriorityColor(task.priority)} transition transform hover:scale-105">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-lg font-bold text-gray-800 ${task.completed ? 'line-through' : ''}">${task.title}</h3>
                        <span class="px-3 py-1 text-xs font-semibold rounded-full ${getPriorityBadge(task.priority)}">
                            ${task.priority.toUpperCase()}
                        </span>
                    </div>
                    <p class="text-gray-600 mb-4 ${task.completed ? 'line-through' : ''}">${task.description || 'No description'}</p>
                    <div class="flex gap-2">
                        <button onclick="toggleTask('${task._id || task.id}')" 
                            class="flex-1 ${task.completed ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-500 hover:bg-green-600'} text-white py-2 rounded-lg transition text-sm">
                            ${task.completed ? 'Undo' : 'Complete'}
                        </button>
                        <button onclick="editTask('${task._id || task.id}')" 
                            class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg transition text-sm">
                            Edit
                        </button>
                        <button onclick="deleteTask('${task._id || task.id}')" 
                            class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg transition text-sm">
                            Delete
                        </button>
                    </div>
                    <div class="mt-3 text-xs text-gray-500">
                        Created: ${new Date(task.createdAt || Date.now()).toLocaleDateString()}
                    </div>
                </div>
            `).join('');
        }

        function getPriorityColor(priority) {
            const colors = {
                low: 'border-green-500',
                medium: 'border-yellow-500',
                high: 'border-red-500'
            };
            return colors[priority] || colors.medium;
        }

        function getPriorityBadge(priority) {
            const badges = {
                low: 'bg-green-100 text-green-800',
                medium: 'bg-yellow-100 text-yellow-800',
                high: 'bg-red-100 text-red-800'
            };
            return badges[priority] || badges.medium;
        }

        // Add task
        document.getElementById('addTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;

            const newTask = {
                title,
                description,
                priority,
                completed: false,
                createdAt: new Date().toISOString()
            };

            try {
                if (demoMode) {
                    newTask.id = Date.now().toString();
                    tasks.push(newTask);
                    localStorage.setItem('demoTasks', JSON.stringify(tasks));
                    displayTasks();
                } else {
                    const token = localStorage.getItem('token');
                    const response = await fetch(`${API_URL}/addTask`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(newTask)
                    });

                    if (response.ok) {
                        await loadTasks();
                    }
                }

                e.target.reset();
            } catch (error) {
                console.error('Error adding task:', error);
            }
        });

        // Toggle task completion
        window.toggleTask = async (id) => {
            try {
                if (demoMode) {
                    const task = tasks.find(t => t.id === id);
                    if (task) {
                        task.completed = !task.completed;
                        localStorage.setItem('demoTasks', JSON.stringify(tasks));
                        displayTasks();
                    }
                } else {
                    const token = localStorage.getItem('token');
                    const task = tasks.find(t => t._id === id);
                    await fetch(`${API_URL}/updateTask/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ ...task, completed: !task.completed })
                    });
                    await loadTasks();
                }
            } catch (error) {
                console.error('Error toggling task:', error);
            }
        };

        // Edit task
        window.editTask = (id) => {
            const task = tasks.find(t => (t._id || t.id) === id);
            if (task) {
                document.getElementById('editTaskId').value = id;
                document.getElementById('editTaskTitle').value = task.title;
                document.getElementById('editTaskDescription').value = task.description || '';
                document.getElementById('editTaskPriority').value = task.priority;
                document.getElementById('editModal').classList.remove('hidden');
            }
        };

        document.getElementById('editTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editTaskId').value;
            const title = document.getElementById('editTaskTitle').value;
            const description = document.getElementById('editTaskDescription').value;
            const priority = document.getElementById('editTaskPriority').value;

            try {
                if (demoMode) {
                    const task = tasks.find(t => t.id === id);
                    if (task) {
                        task.title = title;
                        task.description = description;
                        task.priority = priority;
                        localStorage.setItem('demoTasks', JSON.stringify(tasks));
                        displayTasks();
                    }
                } else {
                    const token = localStorage.getItem('token');
                    await fetch(`${API_URL}/updateTask/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ title, description, priority })
                    });
                    await loadTasks();
                }

                document.getElementById('editModal').classList.add('hidden');
            } catch (error) {
                console.error('Error updating task:', error);
            }
        });

        document.getElementById('cancelEdit').addEventListener('click', () => {
            document.getElementById('editModal').classList.add('hidden');
        });

        // Delete task
        window.deleteTask = async (id) => {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                if (demoMode) {
                    tasks = tasks.filter(t => t.id !== id);
                    localStorage.setItem('demoTasks', JSON.stringify(tasks));
                    displayTasks();
                } else {
                    const token = localStorage.getItem('token');
                    await fetch(`${API_URL}/deleteTask/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    await loadTasks();
                }
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        };

        // Filter tasks
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-purple-600', 'text-white');
                    b.classList.add('bg-gray-200', 'text-gray-700');
                });
                e.target.classList.add('active', 'bg-purple-600', 'text-white');
                e.target.classList.remove('bg-gray-200', 'text-gray-700');
                currentFilter = e.target.dataset.filter;
                displayTasks();
            });
        });

        // Initialize filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.classList.contains('active')) {
                btn.classList.add('bg-purple-600', 'text-white');
            } else {
                btn.classList.add('bg-gray-200', 'text-gray-700');
            }
        });

        // Load tasks on page load
        loadTasks();
    </script>
</body>
</html>
